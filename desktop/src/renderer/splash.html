<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'"
    />
    <title>wt.ai</title>
    <style>
      /*
        Fontes do sistema de propósito: o splash aparece antes de qualquer rede
        estar garantida, então nada aqui pode depender de download externo.
      */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #12161f;
        color: #e6e9f0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu,
          sans-serif;
        user-select: none;
        cursor: default;
        -webkit-app-region: drag;
        border-radius: 12px;
        overflow: hidden;
      }

      .logo {
        width: 200px;
        height: auto;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        letter-spacing: 0.2px;
        color: #9aa4b8;
      }

      .spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(154, 164, 184, 0.25);
        border-top-color: #6ea8fe;
        border-radius: 50%;
        animation: girar 0.8s linear infinite;
      }

      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="logo.png" alt="wt.ai" />
    <div class="status">
      <div class="spinner"></div>
      <span>Iniciando servidor&hellip;</span>
    </div>
  </body>
</html>
